# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class so R classes are per-module.
android.nonTransitiveRClass=true

# Allow compiling against Android SDK 36 with the current Android Gradle Plugin
# (AGP 8.7.x was validated up to compileSdk 35; the app uses only stable APIs).
android.suppressUnsupportedCompileSdk=36
